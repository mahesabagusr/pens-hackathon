services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports: ["5433:5432"] # host 5433 avoids clashing with a local Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password123}
    ports: ["7474:7474", "7688:7687"] # browser UI, bolt (host 7688 avoids local clashes)
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_AUTH%%/*} -p $${NEO4J_AUTH#*/} 'RETURN 1'"]
      interval: 5s
      retries: 20

  # One-shot: applies Prisma migrations, then exits.
  migrate:
    build: { context: ., target: builder }
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
    depends_on:
      postgres: { condition: service_healthy }
    profiles: [app]

  app:
    build: .
    ports: ["${APP_PORT:-3000}:3000"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password123}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-} # dashboard chat
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-} # only scripts/judge-interactions.mts needs it
      JEV_TOKEN_LIMIT: ${JEV_TOKEN_LIMIT:-100000000} # team cap on Jev input tokens
      JEV_USAGE_FILE: ${JEV_USAGE_FILE:-} # empty = jev-usage.jsonl in the app folder
      JEV_CHAT_CHECK: ${JEV_CHAT_CHECK:-} # "1" = Jev checks chat answers (spends tokens)
    depends_on:
      migrate: { condition: service_completed_successfully }
      neo4j: { condition: service_healthy }
    profiles: [app]

volumes:
  pgdata:
  neo4jdata:
